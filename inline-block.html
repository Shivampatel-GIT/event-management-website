<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a {
            display: inline;
            width: 100px;
            height: 100px;
            padding: 5px;
            border: 1px solid black;
            background-color: yellow;
        }
        .b {
            display: inline-block;
            width: 100px;
            height: 100px;
            padding: 5px;
            border: 1px solid black;
            background-color: aqua;
        }
        .c {
            display: block;
            width: 100px;
            height: 100px;
            padding: 5px;
            border: 1px solid black;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <span class="a">Welcome Cybrom</span>
    <span class="a">Welcome Cybrom!</span>

    <span class="b">Welcome Cybrom</span>
    <span class="b">Welcome Cybrom!</span>

    <span class="c">Welcome Cybrom</span>
    <span class="c">Welcome Cybrom!</span>
</body>
</html>
